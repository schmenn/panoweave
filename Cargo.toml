[package]
name = "panoweave"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "rayon"] }
rayon = "1.12.0"
rfd = "0.17.2"
kamadak-exif = "0.6"
imagepipe = "0.5.1"
rawloader = "0.37.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
open = "5.4.5"
half = "2.7"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
