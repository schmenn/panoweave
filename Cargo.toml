[package]
name = "panoweave"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Guided panorama stitching: automatic control points, alignment, seam finding and blending"
readme = "README.md"
repository = "https://github.com/schmenn/panoweave"
keywords = ["panorama", "image-stitching", "photography"]
categories = ["multimedia::images"]

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "rayon"] }
rayon = "1.12.0"
rfd = "0.17.2"
kamadak-exif = "0.6"
imagepipe = { version = "0.5.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
open = "5.4.5"
half = "2.7"
png = "0.18.1"
tiff = "0.11.3"
jpeg-encoder = "0.7.1"

[features]
# RAW photos (CR2, NEF, ARW, DNG, ...) through imagepipe/rawloader, which are LGPL licensed. On by default;
# build with --no-default-features to leave them out (JPEG, PNG and TIFF keep working).
default = ["raw"]
raw = ["dep:imagepipe"]

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# `cargo clippy --all-targets -- -D warnings` runs in the CI. Lints switched off on purpose:
[lints.clippy]
# Numeric and pipeline functions take many plain parameters; bundling them into structs would not make them clearer.
too_many_arguments = "allow"
# Nested result tuples of worker jobs are read in one place each.
type_complexity = "allow"
# Index loops over several parallel arrays (matrices, pyramids, rows) are clearer than zipped iterators.
needless_range_loop = "allow"
# `!(a >= b)` is used on purpose: a NaN value must make the check fail (stop / undo a round / filter out).
neg_cmp_op_on_partial_ord = "allow"

[build-dependencies]
winresource = "0.1.34"
