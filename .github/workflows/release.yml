name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # installs the version named in rust-toolchain.toml (the same as the CI)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "panoweave-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/panoweave.exe $name/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_LICENSES.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "panoweave-${{ github.ref_name }}-windows-x64.zip" `
            --title "${{ github.ref_name }}" --generate-notes
